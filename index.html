<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f5f1"><meta name="description" content="Explore a 3D bamboo flute, position your own pattern, and download the model."><link rel="icon" type="image/svg+xml" href="./assets/favicon.svg">
  <title>Dizi Studio</title><link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span><h1 data-i18n="title">Dizi Studio</h1><span class="brand-description" data-i18n="workspace">Bamboo flute workshop</span></div>
    <div class="top-actions">
      <a class="project-link" href="https://github.com/qiuxue-yee/bamboo-flute-customizer" data-i18n="sourceLink">GitHub</a>
      <button id="open-guide-btn" class="quiet-button" data-i18n="guide" type="button">Help</button>
      <label><span class="sr-only" data-i18n="language">Language</span><select id="language-select" data-i18n-aria="language"><option value="en">EN</option><option value="zh">中文</option></select></label>
    </div>
  </header>
  <main class="workspace">
    <section class="viewport-frame" data-i18n-aria="viewerLabel">
      <div class="scene-caption"><span class="status-dot"></span><span data-i18n="sceneLabel">YOUR CANVAS, IN BAMBOO</span></div>
      <div id="canvas-container" class="canvas-container"></div>
      <div class="viewport-actions">
        <div class="view-switch" role="group" data-i18n-aria="viewMode">
          <button id="view-full-btn" type="button" data-i18n="fullView" aria-pressed="true">Whole flute</button>
          <button id="view-detail-btn" type="button" data-i18n="detailView" aria-pressed="false">Pattern detail</button>
        </div>
        <button id="reset-view-btn" class="reset-view" type="button" data-i18n="resetView">Reset view</button>
      </div>
      <p class="view-help view-help-desktop" data-i18n="viewHelp">Drag to rotate · Scroll to zoom</p>
      <p class="view-help view-help-touch" data-i18n="viewHelpTouch">Drag to rotate · Pinch to zoom</p>
      <div id="loading-overlay" class="loading-overlay" role="status" aria-live="polite">
        <div class="loading-card"><span id="loading-spinner" class="spinner" aria-hidden="true"></span>
          <p id="loading-message" data-i18n="loading"></p><p id="loading-detail" class="loading-detail" hidden></p>
          <button id="retry-btn" class="button button-secondary" type="button" data-i18n="retry" hidden>Try again</button>
        </div>
      </div>
    </section>
    <aside class="right-panel" data-i18n-aria="controlsLabel">
      <div class="panel-content">
        <section class="preset-section">
          <div class="section-heading"><h2 data-i18n="choosePattern">Start with a pattern</h2><span class="section-number">01</span></div>
          <p class="section-note" data-i18n="presetHint">A few ideas to make it yours.</p>
          <div id="preset-grid" class="preset-grid"></div>
        </section>
        <section class="upload-section">
          <button id="pattern-upload" class="upload-zone" type="button">
            <svg viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M12 16V4m-4 4 4-4 4 4M4 15v5h16v-5"/></svg>
            <span class="upload-title" data-i18n="chooseFile">Upload your image</span>
            <span class="upload-hint" data-i18n="dropHint">or drop it here · PNG, JPG, WebP</span>
          </button>
          <input id="image-input" type="file" accept="image/png,image/jpeg,image/webp" hidden>
        </section>
        <section id="pattern-editor" class="editor-section" hidden>
          <div class="section-heading"><h2 id="preview-title" data-i18n="patternLayout">Make it fit</h2><span class="section-number">02</span></div>
          <div class="editor-preview">
            <canvas id="image-preview" width="1024" height="565" tabindex="0" data-i18n-aria="dragPattern" aria-label="Drag to position your pattern"></canvas>
            <span class="drag-hint" data-i18n="dragHint">Drag to position</span>
          </div>
          <div class="file-row"><span id="file-name-display" class="file-name" role="status"></span><button id="clear-image-btn" class="quiet-button" type="button" data-i18n="clearPattern">Remove</button></div>
          <div class="range-group"><div class="range-heading"><label for="u-slider" data-i18n="horizontal">Horizontal</label><output id="u-value" for="u-slider">0.00</output></div><input id="u-slider" type="range" min="-1" max="1" step="0.01" value="0"></div>
          <div class="range-group"><div class="range-heading"><label for="v-slider" data-i18n="vertical">Vertical</label><output id="v-value" for="v-slider">0.00</output></div><input id="v-slider" type="range" min="-1" max="1" step="0.01" value="0"></div>
          <p id="preview-status" class="sr-only" role="status" aria-live="polite"></p>
        </section>
        <div id="history-actions" class="button-row" hidden><button id="reset-position-btn" class="quiet-button" type="button" data-i18n="resetPosition">Center</button><div><button id="undo-btn" class="quiet-button" type="button" data-i18n="undo">Undo</button><button id="redo-btn" class="quiet-button" type="button" data-i18n="redo">Redo</button></div></div>
        <p id="app-status" class="app-status" role="status" aria-live="polite"></p>
      </div>
      <section class="export-section" aria-label="Export">
        <div class="download-row"><label class="sr-only" for="export-format-select" data-i18n="format"></label>
          <select id="export-format-select"><option value="zip" data-i18n="zip">Full package · ZIP</option><option value="glb" data-i18n="glb">Patterned part · GLB</option><option value="stl" data-i18n="stl">Geometry · STL</option></select>
          <button id="export-model-btn" class="button button-primary" type="button"><span data-i18n="exportButton">Download</span><span aria-hidden="true">↗</span></button>
        </div>
        <label id="stl-option" class="checkbox-row"><input id="include-stl-checkbox" type="checkbox" checked><span data-i18n="includeStl">Include STL files</span></label>
        <p class="format-note" data-i18n="formatNote"></p>
        <p id="export-status" class="export-status" role="status" aria-live="polite"></p>
      </section>
    </aside>
  </main>
  <dialog id="guide-dialog" aria-labelledby="guide-title">
    <div class="dialog-heading"><h2 id="guide-title" data-i18n="guide">Help</h2><button id="close-guide-btn" class="dialog-close" type="button" data-i18n-aria="close">×</button></div>
    <h3 data-i18n="guideViewTitle"></h3><p data-i18n="guideView"></p>
    <h3 data-i18n="guidePatternTitle"></h3><p data-i18n="guidePattern"></p>
    <h3 data-i18n="guideExportTitle"></h3><p data-i18n="guideExport"></p>
    <p class="guide-note" data-i18n="guideUnits"></p>
  </dialog>
  <div id="toast-container" class="toast-container" aria-live="polite"></div>
  <script type="module" src="/main.js"></script>
</body></html>
